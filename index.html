<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CircuitCalculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome!</h1>
    <p> This website can be used to calculate electrical cirucit values. </p> 
    <h2>Ohm's Law calculator</h2>
    <p>Formula: V = I x R </p>
    <label>Voltage (V)</label>
    <input type="number" id="voltage">
    <label>Current (A)</label>
    <input type="number" id="current">
    <label>Resistance (Ω)</label>
    <input type="number" id="resistance">
    <button id="calculate">Calculate</button>
    <p id="result"></p>
    <script src="script.js"></script>
</body>
</html>
